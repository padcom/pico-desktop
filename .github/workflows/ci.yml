name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  js:
    name: JS (lint, build, typecheck, test)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  native:
    name: Native runtime (CMake, ctest)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: cmake --version
      - run: cmake --preset default
      - run: cmake --build --preset default
      - run: ctest --preset default
      - name: The same under ASan and UBSan (with the fuzz test)
        timeout-minutes: 15
        run: |
          # ASan can't map its shadow memory with the runner kernel's 32 random mmap bits (it spins
          # on DEADLYSIGNAL); 28 is the usual setting for sanitizer runs.
          sudo sysctl -w vm.mmap_rnd_bits=28
          cmake --preset sanitize
          cmake --build --preset sanitize
          # On this runner ASan records each allocation's stack slowly (~330× slower than on a dev
          # machine); a short recorded stack keeps the reports useful and the run fast.
          export ASAN_OPTIONS=malloc_context_size=4
          ctest --preset sanitize --timeout 120 -E ipc.fuzz
          time build/sanitize/runtime/ipc/pd_ipc_fuzz_test 300000 "$GITHUB_RUN_NUMBER"

  native-other:
    # The CEF-free runtime (IPC, framing, CBOR, the host's core and its stub) on the other
    # desktop systems, natively: the first step of F6's six targets (the CEF host isn't ported).
    name: Native runtime, ${{ matrix.target }} (CMake, ctest)
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: windows-x64
            runner: windows-2025
          - target: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake --version
      - run: cmake --preset default
      - run: cmake --build --preset default
      - run: ctest --preset default

  cef-host:
    name: CEF host, ${{ matrix.target }} (build, self-tests under Xvfb)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for both: real ARM64 and x64 execution, not cross-compiled output.
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the pinned CEF
        uses: actions/cache@v4
        with:
          path: ~/.cache/pico-desktop/cef
          key: cef-${{ matrix.target }}-${{ hashFiles('toolchain.json') }}
      - name: Fetch and verify CEF
        run: pnpm cef:fetch
      - name: Build and runtime libraries, Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libx11-dev libnss3 libatk1.0-0t64 \
            libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libgtk-3-0t64
      - name: Allow unprivileged user namespaces (the sandbox needs them; it's never disabled)
        # Ubuntu 24.04 restricts them through AppArmor by default (see docs/platform-linux.md).
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Resolve the pinned Pico release (hello-world's backend needs it)
        id: pico
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .pico.minimum toolchain.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" -R padcom/pico-lang > /dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pico $version isn't released yet; the hello-world end-to-end test is skipped"
          fi
      - name: Install Pico
        if: steps.pico.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.pico.outputs.version }}
          gh release download "v$v" -R padcom/pico-lang -p "pico-$v-${{ matrix.target }}.tar.gz" -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/pico" && tar -xzf "$RUNNER_TEMP/pico-$v-${{ matrix.target }}.tar.gz" -C "$RUNNER_TEMP/pico"
          bin=$(dirname "$(find "$RUNNER_TEMP/pico" -type f -name pico -perm -u+x | head -1)")
          echo "$bin" >> "$GITHUB_PATH"
      - name: Build hello-world (self-test frontend, Pico backend) and the CLI (for the dev-loop test)
        if: steps.pico.outputs.available == 'true'
        run: |
          pnpm --filter pico-desktop... build
          pnpm --filter @pico-desktop/hello-world... build
          pnpm --filter @pico-desktop/hello-world build:self-test
          pnpm --filter @pico-desktop/hello-world backend
      - name: Build the host and run its self-tests (hello-world and the dev loop too, when pico is there)
        env:
          PD_BUNDLE_OUT: ${{ runner.temp }}/bundle  # cli.bundle keeps its package for bundle-smoke
        run: pnpm cef
      - name: Keep the packaged app (cli.bundle's) for the clean-machine smoke test
        if: steps.pico.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: ${{ runner.temp }}/bundle/
          retention-days: 3
          if-no-files-found: error

  cef-host-macos:
    # F6: the CEF host as a macOS app bundle (main app + helper apps), built and self-tested on
    # Apple Silicon. The CEF archive is checked against the upstream index's SHA-1.
    name: CEF host, macos-arm64 (build, self-tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the pinned CEF
        uses: actions/cache@v4
        with:
          path: ~/.cache/pico-desktop/cef
          key: cef-macos-arm64-${{ hashFiles('toolchain.json') }}
      - name: Fetch, verify and configure CEF
        run: pnpm cef:configure
      - name: Build the host (the app bundle and its helpers)
        run: pnpm cef:build
      - name: Install Pico (the macos-arm64 release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(jq -r .pico.minimum toolchain.json)
          gh release download "v$v" -R padcom/pico-lang -p "pico-$v-macos-arm64.tar.gz" -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/pico" && tar -xzf "$RUNNER_TEMP/pico-$v-macos-arm64.tar.gz" -C "$RUNNER_TEMP/pico"
          bin=$(dirname "$(find "$RUNNER_TEMP/pico" -type f -name pico -perm -u+x | head -1)")
          echo "$bin" >> "$GITHUB_PATH"
      - name: The fixture, hello-world and the CLI
        run: |
          pnpm --filter @pico-desktop/host-fixture... build
          pnpm --filter pico-desktop... build
          pnpm --filter @pico-desktop/hello-world... build
          pnpm --filter @pico-desktop/hello-world build:self-test
          pnpm --filter @pico-desktop/hello-world backend
      - name: The host's tests in a real window
        run: ctest --preset cef --output-on-failure

  cef-host-windows:
    # F6: the CEF host on Windows x64: pico-desktop-host.dll run by CEF's console bootstrap
    # (the sandbox's way since CEF 138), built with MSVC and self-tested in a real window.
    name: CEF host, windows-x64 (build, self-tests)
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the pinned CEF
        uses: actions/cache@v4
        with:
          path: ~/.cache/pico-desktop/cef
          key: cef-windows-x64-${{ hashFiles('toolchain.json') }}
      - name: Fetch, verify and configure CEF
        run: PD_CEF_ROOT=$(node scripts/fetch-cef.mjs) cmake --preset cef
      - name: Build the host
        run: cmake --build --preset cef
      - name: Install Pico (the windows-x64 release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(jq -r .pico.minimum toolchain.json)
          gh release download "v$v" -R padcom/pico-lang -p "pico-$v-windows-x64.zip" -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/pico" && unzip -q "$RUNNER_TEMP/pico-$v-windows-x64.zip" -d "$RUNNER_TEMP/pico"
          bin=$(dirname "$(find "$RUNNER_TEMP/pico" -type f -name pico.exe | head -1)")
          cygpath -w "$bin" >> "$GITHUB_PATH"
      - name: The fixture, hello-world and the CLI
        run: |
          pnpm --filter @pico-desktop/host-fixture... build
          pnpm --filter pico-desktop... build
          pnpm --filter @pico-desktop/hello-world... build
          pnpm --filter @pico-desktop/hello-world build:self-test
          pnpm --filter @pico-desktop/hello-world backend
      - name: The host's tests in a real window
        run: ctest --preset cef --output-on-failure

  bundle-smoke:
    # F6's clean-machine smoke: the packaged app on a fresh runner of its target, with only the
    # runtime libraries a desktop has (docs/platform-linux.md) and a display. No build tree, no
    # Node, pnpm, Pico or CMake on the app's PATH.
    name: Packaged app on a clean machine, ${{ matrix.target }}
    needs: cef-host
    # Known: pico 0.4.2 builds the backend for the build runner's CPU (AVX-512 on some x64
    # runners), so it can SIGILL on another (pico-lang #117, PR #120). Remove once a pico release
    # has the fix.
    continue-on-error: ${{ matrix.target == 'linux-x64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tooling/cli/tests/smoke-bundle.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: ${{ runner.temp }}/bundle
      - name: Runtime libraries and Xvfb only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libnss3 libatk1.0-0t64 \
            libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libgtk-3-0t64
      - name: Allow unprivileged user namespaces (the sandbox needs them; it's never disabled)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run it
        run: tooling/cli/tests/smoke-bundle.sh "$(ls "$RUNNER_TEMP"/bundle/*.tar.gz)"

  pico:
    name: Pico (communicator-pico, probes)
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the pinned Pico release
        id: pico
        run: |
          version=$(jq -r .pico.minimum toolchain.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" -R padcom/pico-lang > /dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pico $version isn't released yet (needs pico-lang #82); skipping the Pico job"
          fi
      - name: Install Pico
        if: steps.pico.outputs.available == 'true'
        run: |
          v=${{ steps.pico.outputs.version }}
          gh release download "v$v" -R padcom/pico-lang -p "pico-$v-linux-arm64.tar.gz" -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/pico" && tar -xzf "$RUNNER_TEMP/pico-$v-linux-arm64.tar.gz" -C "$RUNNER_TEMP/pico"
          bin=$(dirname "$(find "$RUNNER_TEMP/pico" -type f -name pico -perm -u+x | head -1)")
          echo "$bin" >> "$GITHUB_PATH"
      - if: steps.pico.outputs.available == 'true'
        run: pico --version
      - if: steps.pico.outputs.available == 'true'
        run: pico test packages/communicator-pico
      - name: hello-world backend tests and lint
        if: steps.pico.outputs.available == 'true'
        working-directory: apps/hello-world/backend
        run: pico test . && pico lint .
      - if: steps.pico.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Capability probes
        if: steps.pico.outputs.available == 'true'
        working-directory: probes
        # The child the process probe talks to is built first.
        run: |
          pico build --release src/stdio_echo.pi -o bin/stdio_echo
          pico test
          node harness/stdio-harness.mjs
